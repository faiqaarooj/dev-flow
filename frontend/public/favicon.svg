<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="shieldGrad" x1="8" y1="6" x2="56" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f4c453"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="coreGlow" x1="16" y1="16" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f4c453" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Shield Container -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#090a10" stroke="#1f2233" stroke-width="2"/>
  
  <!-- Hexagonal Shield Contour -->
  <path d="M32 8L49 16.5V31.5C49 42 41.5 50.8 32 55C22.5 50.8 15 42 15 31.5V16.5L32 8Z" 
        fill="url(#coreGlow)" 
        stroke="url(#shieldGrad)" 
        stroke-width="2.5" 
        stroke-linejoin="round"/>
        
  <!-- Interlocking Flow Paths ("Dev" & "Flow") -->
  <!-- Left Code Bracket < -->
  <path d="M26 23L20 29.5L26 36" 
        stroke="#f4c453" 
        stroke-width="2.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
        
  <!-- Right Code Bracket > -->
  <path d="M38 23L44 29.5L38 36" 
        stroke="#a855f7" 
        stroke-width="2.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
        
  <!-- Central Pulse Node & Flow Lightning -->
  <circle cx="32" cy="29.5" r="3" fill="#f4c453" filter="url(#glow)"/>
  <path d="M29 39.5L35 39.5M32 37V42" 
        stroke="#f4c453" 
        stroke-width="2" 
        stroke-linecap="round"/>
</svg>